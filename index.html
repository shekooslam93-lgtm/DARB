<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARB - درب للتوصيل</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22c55e">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
<div class="bg-white text-black rounded-3xl p-8 max-w-sm w-full text-center">
<div class="w-20 h-20 bg-green-500 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl font-black mb-4">D</div>
<h1 class="text-3xl font-black">DARB - درب</h1>
<p class="text-gray-500 mt-2">توصيل سريع في جدة</p>
<div class="text-right mt-6 space-y-2 text-sm bg-gray-50 p-4 rounded-xl">
<p>✅ تتبع الشحنة لحظي</p>
<p>✅ دفع آمن</p>
<p>✅ توصيل 24 ساعة</p>
</div>
<button id="installBtn" class="mt-6 w-full bg-green-500 text-white py-4 rounded-xl font-bold">📲 تحميل التطبيق</button>
<p id="msg" class="text-xs text-gray-400 mt-3"></p>
</div>
<script>
let deferredPrompt;
const btn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.innerText='📲 ثبّت الآن';});
btn.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();const c=await deferredPrompt.userChoice;if(c.outcome==='accepted')btn.innerText='✅ تم التثبيت';deferredPrompt=null;}else{document.getElementById('msg').innerText='دوس 3 نقط فوق ثم اضافة للشاشة الرئيسية';}});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
